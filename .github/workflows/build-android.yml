name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create a fresh Expo project
        run: npx --yes create-expo-app@latest build --template blank --no-install

      - name: Install dependencies
        working-directory: build
        run: |
          npm install
          npx expo install @react-native-async-storage/async-storage react-native-safe-area-context

      - name: Add the app code
        run: cp App.js build/App.js

      - name: Set app name and package id
        working-directory: build
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          node <<'JS'
          const fs = require("fs");
          const repo = process.env.REPO || "app";
          const slug = repo.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "app";
          const id = slug.replace(/-/g, "");
          const pkg = "com.app." + (/^[a-z]/.test(id) ? id : "a" + id);
          const name = repo.replace(/[-_]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
          const j = JSON.parse(fs.readFileSync("app.json", "utf8"));
          j.expo.name = name;
          j.expo.slug = slug;
          j.expo.android = { ...(j.expo.android || {}), package: pkg };
          j.expo.ios = { ...(j.expo.ios || {}), bundleIdentifier: pkg };
          fs.writeFileSync("app.json", JSON.stringify(j, null, 2));
          JS

      - name: Generate the Android project
        working-directory: build
        run: npx expo prebuild --platform android

      - name: Build the APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
